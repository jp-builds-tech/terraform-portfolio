name: ci

on:
  push:
    branches: [main]
    paths:
      - "k8s-platform/**"
      - "aws-lab/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "k8s-platform/**"
      - "aws-lab/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: ${{ matrix.project }} - fmt, validate, lint, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: k8s-platform
            dirs: "cluster platform modules/app"
            module_dir: modules/app
          - project: aws-lab
            dirs: "bootstrap network modules/vpc"
            module_dir: modules/vpc
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          for dir in ${{ matrix.dirs }}; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: TFLint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/${{ matrix.project }}/.tflint.hcl"

      - name: Unit tests
        run: terraform -chdir=${{ matrix.module_dir }} test

  security:
    name: ${{ matrix.project }} - checkov
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: k8s-platform
            soft_fail: false
          - project: aws-lab
            soft_fail: true
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.project }}
          framework: terraform
          quiet: true
          soft_fail: ${{ matrix.soft_fail }}
